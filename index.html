<div class="row"><div><label for="inc">বার্ষিক করযোগ্য আয় (টাকা)</label><input id="inc" type="number" min="0" inputmode="numeric" placeholder="যেমন 800000"></div>
<div><label for="loc">এলাকা</label><select id="loc">${Object.keys(MIN_TAX).map(k=>`<option>${k}</option>`).join("")}</select></div></div>
<p><button onclick="calc()">হিসাব করুন</button></p><div id="out" aria-live="polite"></div></div>
<div class="box"><h2 style="margin-top:0">রিটার্নের নথির তালিকা</h2>${DOCS.map((d,i)=>`<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input style="width:auto" type="checkbox" onchange="chk()"> ${d}</label>`).join("")}<p id="ck" class="mute"></p></div>
<div class="box"><h2 style="margin-top:0">গুরুত্বপূর্ণ সময়সীমা</h2><p>ব্যক্তি করদাতার রিটার্ন জমার সাধারণ শেষ সময় <b>৩০ নভেম্বর</b>। NBR সময় বাড়ালে বা বদলালে আপডেট পাতা দেখুন।</p><p id="days" class="res"></p></div>`],
consult:["পরামর্শ",()=>`<h1>বিনামূল্যে পরামর্শ</h1><p class="mute">প্রথম পরামর্শ বিনামূল্যে। নির্দিষ্ট পরামর্শের জন্য আপনার কাগজপত্র দেখতে হতে পারে। পরামর্শের সময়: ${CFG.hours}।</p>
<div class="box"><div class="row"><div><label for="n">আপনার নাম</label><input id="n"></div><div><label for="p">মোবাইল নম্বর</label><input id="p" type="tel"></div></div>
<label for="t">বিষয়</label><select id="t"><option>ট্যাক্স নোটিশ</option><option>রিটার্ন জমা</option><option>TIN</option><option>উৎসে কর</option><option>অন্যান্য</option></select>
<label for="m">আপনার সমস্যা</label><textarea id="m" rows="4"></textarea>
<p><button id="cb" onclick="send('form')">জমা দিন</button> <button class="alt" onclick="send('wa')">WhatsApp-এ পাঠান</button></p><p id="err" class="mute"></p></div>`],
about:["পরিচিতি",()=>`<h1>বিশেষজ্ঞ পরিচিতি</h1>
<div class="box prof"><div class="av" aria-hidden="true">জু</div><div><h2 style="margin:0">${CFG.expert}</h2><p class="mute" style="margin:0">ট্যাক্স এক্সপার্ট · ট্যাক্স ডিভিশন, মেঘনা গ্রুপ (MGI)</p></div></div>
<p>${CFG.expert} মেঘনা গ্রুপের ট্যাক্স ডিভিশনে দীর্ঘদিন ধরে কর্মরত। কর্পোরেট পর্যায়ের কর ব্যবস্থাপনার বাস্তব অভিজ্ঞতা থেকে তিনি সাধারণ করদাতাদের রিটার্ন, নোটিশ ও কর সংক্রান্ত নানা জটিলতায় সহজ ভাষায় দিকনির্দেশনা দেন।</p>
<h2>পেশাগত অভিজ্ঞতা</h2>
<div class="tl">
<p><b>মেঘনা গ্রুপ (MGI)</b><br><span class="mute">বর্তমান · ট্যাক্স ডিভিশন, ট্যাক্স এক্সপার্ট</span></p>
<p><b>আনোয়ার গ্রুপ</b><br><span class="mute">পূর্ববর্তী কর্মস্থল</span></p>
<p><b>দেশবন্ধু গ্রুপ</b><br><span class="mute">পূর্ববর্তী কর্মস্থল</span></p>
<p><b>এসিআই (ACI)</b><br><span class="mute">পূর্ববর্তী কর্মস্থল</span></p></div>
<h2>যেসব বিষয়ে সহায়তা পাবেন</h2>
<ul><li>আয়কর রিটার্ন প্রস্তুতি ও জমা</li><li>ট্যাক্স নোটিশের উত্তর ও করণীয়</li><li>উৎসে কর ও ক্রেডিট সংক্রান্ত সমস্যা</li><li>সম্পদ ও দায়ের বিবরণী</li><li>কর পরিকল্পনা ও কর্পোরেট কর সংক্রান্ত দিকনির্দেশনা</li></ul>
<p class="mute">এটি বিশেষজ্ঞের ব্যক্তিগত উদ্যোগ। এখানকার তথ্য বা পরামর্শ কোনো কোম্পানির প্রতিনিধিত্ব করে না।</p>
<p><a class="btn" href="#consult">বিনামূল্যে পরামর্শ নিন</a></p>`],
contact:["যোগাযোগ",()=>`<h1>যোগাযোগ</h1><p class="mute">সরাসরি কল বা WhatsApp করতে পারেন। সমস্যার বিবরণ লিখে পাঠালে পরামর্শ দেওয়া সহজ হয়।</p>
<div class="box"><p><b>মোবাইল ১:</b> <a href="tel:${CFG.phone}">${CFG.phone}</a><br><span class="mute">কল ও WhatsApp</span></p><p><b>মোবাইল ২:</b> <a href="tel:${CFG.phone2}">${CFG.phone2}</a><br><span class="mute">সরাসরি কল</span></p><p><b>ইমেইল:</b> <a href="mailto:${CFG.email}">${CFG.email}</a><br><span class="mute">কাগজপত্র বা বিস্তারিত পাঠাতে</span></p><p><b>Facebook:</b> <a href="${CFG.facebook}" target="_blank" rel="noopener">পেজ দেখুন</a></p><p><b>অফিসের ঠিকানা:</b> ${CFG.address} · <a href="${CFG.map}" target="_blank" rel="noopener">Google Map-এ দেখুন</a></p><p><b>পরামর্শের সময়:</b> ${CFG.hours}</p>
<a class="btn" href="https://wa.me/${CFG.whatsapp}" target="_blank" rel="noopener">WhatsApp করুন</a> <a class="btn alt" href="#consult">ফর্মে জানান</a></div>`],
privacy:["গোপনীয়তা নীতি",()=>`<h1>গোপনীয়তা নীতি</h1><p>আপনি ফর্মে নাম, মোবাইল নম্বর, ইমেইল ও সমস্যার বিবরণ দিলে তা শুধু আপনার সাথে যোগাযোগ ও পরামর্শের জন্য ব্যবহার হবে। আপনার তথ্য বিক্রি বা অন্য কাউকে দেওয়া হবে না।</p><p>ফর্মের তথ্য ইমেইল পরিষেবার (FormSubmit) মাধ্যমে বা WhatsApp-এর মাধ্যমে আমাদের কাছে পৌঁছায়। তথ্য মুছে ফেলতে চাইলে ${CFG.email} এ জানান।</p>`],
disclaimer:["দায়মুক্তি",()=>`<h1>দায়মুক্তি (Disclaimer)</h1><p>এই সাইটের তথ্য সাধারণ ধারণার জন্য, এটি আইনি বা পেশাদার পরামর্শ নয়। কর আইন ও NBR-এর নির্দেশ বদলাতে পারে, তাই সিদ্ধান্তের আগে হালনাগাদ নিয়ম যাচাই করুন। নির্দিষ্ট পরামর্শের জন্য আপনার কাগজপত্র দেখা প্রয়োজন হতে পারে।</p><p>এটি বিশেষজ্ঞের ব্যক্তিগত উদ্যোগ; কোনো কোম্পানির প্রতিনিধিত্ব বা মতামত নয়।</p>`],
terms:["ব্যবহারের শর্ত",()=>`<h1>ব্যবহারের শর্ত</h1><p>এই সাইট ব্যবহার করলে আপনি শর্তগুলো মেনে নিচ্ছেন। সাইটের লেখা অনুমতি ছাড়া অন্যত্র প্রকাশ করা যাবে না। ক্যালকুলেটরের ফলাফল আনুমানিক, এর ভিত্তিতে নেওয়া সিদ্ধান্তের দায় সাইটের নয়। প্রয়োজনে শর্ত বদলানো হতে পারে।</p>`]
};
function subscribe(){return `<div class="box"><b>নতুন গাইড ও আপডেটের খবর ইমেইলে পেতে</b><div class="search"><input id="se" type="email" placeholder="আপনার ইমেইল" aria-label="ইমেইল"><button id="sb" onclick="sub()">সাবস্ক্রাইব</button></div><p id="ss" class="mute" aria-live="polite"></p></div>`}
/* ===== ফাংশন ===== */
function go(e){e.preventDefault();location.hash="search/"+encodeURIComponent(document.getElementById("q").value.trim());return false}
function searchPage(q){q=decodeURIComponent(q||"").toLowerCase();const hit=[];
PROBLEMS.forEach(p=>{if((p[0]+p[1]).toLowerCase().includes(q))hit.push(["সমস্যা",p[0],p[1],"problems"])});
GUIDES.forEach(g=>{if((g[1]+g[2]).toLowerCase().includes(q))hit.push(["গাইড",g[1],g[2],"guides"])});
return `<h1>"${q}" এর ফলাফল</h1>${hit.length?hit.map(h=>`<a class="tile" style="margin:8px 0" href="#${h[3]}"><small class="mute">${h[0]}</small><h3>${h[1]}</h3>${h[2].slice(0,110)}…</a>`).join(""):`<p>কিছু পাওয়া যায়নি। অন্য শব্দ দিয়ে চেষ্টা করুন বা <a href="#consult">আমাদের জানান</a>।</p>`}`}
function calc(){const v=+document.getElementById("inc").value,o=document.getElementById("out");
if(!(v>=0)||!document.getElementById("inc").value){o.innerHTML="আয়ের পরিমাণ লিখুন।";return}
let rest=Math.max(0,v-FREE),tax=0;for(const[s,r]of SLABS){const x=Math.min(rest,s);tax+=x*r;rest-=x;if(rest<=0)break}
const min=MIN_TAX[document.getElementById("loc").value];let note="";
if(v>FREE&&tax<min){tax=min;note=" (ন্যূনতম কর প্রযোজ্য)"}
if(v<=FREE)tax=0;
o.innerHTML=`<span class="res">আনুমানিক কর: ${tk(tax)}</span>${note}<p class="mute">করমুক্ত সীমা ${tk(FREE)}। সঠিক হিসাব ছাড়-রেয়াত ও আপনার অবস্থা দেখে হয়।</p>`}
function chk(){const c=[...document.querySelectorAll('#app input[type=checkbox]')];document.getElementById("ck").textContent=c.filter(x=>x.checked).length+" / "+c.length+" টি প্রস্তুত"}
async function send(how){const n=v("n"),p=v("p"),t=v("t"),m=v("m"),er=document.getElementById("err");
if(!n||!p||!m){er.textContent="নাম, মোবাইল নম্বর ও সমস্যা লিখুন।";return}er.textContent="";
const txt=`নাম: ${n}\nমোবাইল: ${p}\nবিষয়: ${t}\nসমস্যা: ${m}`;
if(how=="wa"){window.open(`https://wa.me/${CFG.whatsapp}?text=${encodeURIComponent(txt)}`,"_blank");return}
const b=document.getElementById("cb");b.disabled=true;er.textContent="পাঠানো হচ্ছে…";
try{await post({_subject:"পরামর্শের অনুরোধ — "+t,_template:"table",name:n,phone:p,topic:t,message:m});er.textContent="ধন্যবাদ! আপনার অনুরোধ পৌঁছে গেছে। শীঘ্রই যোগাযোগ করা হবে।";["n","p","m"].forEach(i=>document.getElementById(i).value="")}
catch(x){er.textContent="পাঠানো যায়নি। WhatsApp বাটনে চেষ্টা করুন।"}b.disabled=false}
async function post(d){const r=await fetch("https://formsubmit.co/ajax/"+CFG.email,{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify(d)});if(!r.ok)throw 0}
async function sub(){const e=v("se"),b=document.getElementById("sb"),o=document.getElementById("ss");
if(!/^\S+@\S+\.\S+$/.test(e)){o.textContent="সঠিক ইমেইল দিন।";return}
b.disabled=true;o.textContent="পাঠানো হচ্ছে…";
try{await post({_subject:"New subscriber — "+CFG.name,_template:"table",email:e,type:"Subscribe"});o.textContent="ধন্যবাদ! আপনার ইমেইল যুক্ত হয়েছে। নতুন গাইড ও আপডেটের খবর পাবেন।";document.getElementById("se").value=""}
catch(x){o.textContent="পাঠানো যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।"}b.disabled=false}
function v(i){return document.getElementById(i).value.trim()}
function days(){const el=document.getElementById("days");if(!el)return;const n=new Date(),y=n.getFullYear();let d=new Date(y,10,30);if(n>d)d=new Date(y+1,10,30);el.textContent=Math.ceil((d-n)/864e5)+" দিন বাকি ("+d.getDate()+" নভেম্বর "+d.getFullYear()+")"}
function route(){const h=location.hash.slice(1)||"home",[k,arg]=h.split("/"),app=document.getElementById("app");
if(k=="search")app.innerHTML=searchPage(arg);else app.innerHTML=(PAGES[k]||PAGES.home)[1]();
document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")=="#"+k));
document.title=((PAGES[k]||[""])[0]?PAGES[k][0]+" — ":"")+CFG.name;window.scrollTo(0,0);days()}
document.getElementById("nav").innerHTML=Object.keys(PAGES).filter(k=>!["privacy","disclaimer","terms"].includes(k)).map(k=>`<a href="#${k}">${PAGES[k][0]}</a>`).join("");
document.getElementById("foot").innerHTML=`<a href="tel:${CFG.phone}">${CFG.phone}</a> · <a href="tel:${CFG.phone2}">${CFG.phone2}</a> · <a href="mailto:${CFG.email}">${CFG.email}</a> · <a href="https://wa.me/${CFG.whatsapp}" target="_blank" rel="noopener">WhatsApp</a> · <a href="${CFG.facebook}" target="_blank" rel="noopener">Facebook</a>`;
addEventListener("hashchange",route);route();
</script>
</body>
</html>
